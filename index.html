<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-RDA | e-Rapor Digital Al-Iqra</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    @keyframes marquee-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee-scroll 24s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    .rapor-page-number::after {
      content: "Halaman 1";
    }

    @media print {
      @page {
        margin: 12mm 14mm 18mm 14mm;
        @bottom-center {
          content: "Halaman " counter(page);
          font-family: 'Inter', sans-serif;
          font-size: 10px;
          font-weight: 500;
          color: #334155;
          vertical-align: top;
          padding-top: 6px;
        }
      }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .rapor-footer-fixed {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white !important;
      }
      .rapor-page-number {
        visibility: hidden !important;
      }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body x-data="eraporApp()" x-init="initApp()" :class="{ 'dark': darkMode }" class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">

  <!-- TOAST NOTIFICATION -->
  <div x-show="toast.show" x-cloak
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       :class="toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'"
       class="fixed bottom-5 right-5 z-50 text-white px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium no-print">
    <i :class="toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'" class="text-lg"></i>
    <span x-text="toast.message"></span>
  </div>

  <!-- LOADING OVERLAY -->
  <div x-show="loading" x-cloak class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex flex-col items-center justify-center no-print">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-3 border border-slate-200 dark:border-slate-700">
      <div class="w-10 h-10 border-4 border-blue-800 dark:border-blue-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-200" x-text="loadingText">Memproses data ke server...</p>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- HALAMAN LOGIN                                                         -->
  <!-- ===================================================================== -->
  <template x-if="!user">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-950 via-blue-900 to-slate-900 p-4 relative">
      <!-- Tombol Ganti Tema di Halaman Login -->
      <button type="button" @click="toggleTheme()" title="Ganti Tema Light/Dark"
              class="absolute top-5 right-5 w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center transition">
        <i :class="darkMode ? 'fa-solid fa-sun text-amber-300' : 'fa-solid fa-moon text-blue-200'"></i>
      </button>

      <div class="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 border border-transparent dark:border-slate-800">
        
        <div class="md:col-span-5 bg-blue-800 text-white p-8 flex flex-col justify-between relative overflow-hidden">
          <div class="relative z-10">
            <div class="flex items-center gap-3 mb-6">
              <div class="w-12 h-12 rounded-2xl bg-white/95 p-1.5 shadow-md flex items-center justify-center shrink-0">
                <img x-show="master.settings.logo_sekolah" :src="getLogoUrl()" alt="Logo Sekolah"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                     class="w-full h-full object-contain">
                <div :style="master.settings.logo_sekolah ? 'display:none' : 'display:flex'"
                     class="w-full h-full rounded-xl bg-amber-400 text-blue-950 items-center justify-center font-bold text-xl">
                  <i class="fa-solid fa-graduation-cap"></i>
                </div>
              </div>
              <div class="inline-flex items-center gap-2 bg-blue-700/70 px-3 py-1 rounded-full text-xs font-semibold tracking-wide border border-blue-500/40">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                KURIKULUM MERDEKA • 2026
              </div>
            </div>
            <h1 class="text-2xl font-bold leading-snug mb-2">e-RDA 2026</h1>
            <p class="text-blue-200 text-sm leading-relaxed">
              e-RDA adalah e-Rapor Digital Al-Iqra. Aplikasi yang dibangun dan dikembangkan oleh Tim IT SDIT Al-Iqra untuk membantu dewan guru dalam penginputan nilai Rapor.
            </p>
          </div>

          <div class="relative z-10 space-y-3 my-8 text-xs text-blue-100">
            <div class="flex items-center gap-3 bg-blue-900/50 p-3 rounded-xl border border-blue-700/50">
              <i class="fa-solid fa-book-open-reader text-amber-400 text-base"></i>
              <span>CP Kepka BKPDM No. 020/2026 & BSKAP No. 046/H/KR/2025</span>
            </div>
            <div class="flex items-center gap-3 bg-blue-900/50 p-3 rounded-xl border border-blue-700/50">
              <i class="fa-solid fa-wand-magic-sparkles text-emerald-400 text-base"></i>
              <span>Deskripsi Rapor Otomatis Berbasis Predikat Nilai</span>
            </div>
          </div>

          <div class="relative z-10 text-xs text-blue-300">
            &copy; 2026 | Tim IT SDIT AL-IQRA
          </div>
        </div>

        <div class="md:col-span-7 p-8 md:p-10 flex flex-col justify-center">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Masuk ke Aplikasi</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Gunakan akun Wali Kelas, Guru Mapel Tahfizh, atau Admin.</p>
          </div>

          <div class="mb-5 bg-slate-50 dark:bg-slate-800/70 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-server text-blue-700 dark:text-blue-400"></i> URL Web App Google Apps Script
              </label>
              <button type="button" @click="showApiInput = !showApiInput" class="text-xs text-blue-700 dark:text-blue-400 hover:underline font-medium">
                <span x-text="showApiInput ? 'Sembunyikan' : 'Ubah URL'"></span>
              </button>
            </div>
            <div x-show="showApiInput" class="mt-2">
              <input type="url" x-model="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"
                     class="w-full text-xs px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>
            <div x-show="!showApiInput" class="text-xs text-emerald-700 dark:text-emerald-400 font-medium truncate">
              <i class="fa-solid fa-link mr-1"></i> <span x-text="apiUrl || 'Belum diatur (Klik Ubah URL)'"></span>
            </div>
          </div>

          <form @submit.prevent="login()" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                  <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" x-model="loginForm.username" required placeholder="Masukkan username akun Anda"
                       class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-blue-700 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" x-model="loginForm.password" required placeholder="••••••••"
                       class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-blue-700 focus:outline-none">
              </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm mt-3">
              <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
            </button>
          </form>
        </div>

      </div>
    </div>
  </template>

  <!-- ===================================================================== -->
  <!-- WORKSPACE UTAMA                                                       -->
  <!-- ===================================================================== -->
  <template x-if="user">
    <div class="min-h-screen flex flex-col md:flex-row relative">

      <!-- BACKDROP SIDEBAR MOBILE -->
      <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"
           class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 md:hidden no-print"></div>

      <!-- SIDEBAR -->
      <aside :class="sidebarOpen ? 'translate-x-0 md:w-64' : '-translate-x-full md:translate-x-0 md:w-0 md:overflow-hidden'"
             class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-blue-950 text-slate-200 flex flex-col shrink-0 transition-all duration-300 ease-in-out no-print">
        <div class="h-16 px-5 flex items-center justify-between bg-blue-900/60 border-b border-blue-800/60 shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-white text-blue-950 flex items-center justify-center font-bold text-lg shadow shrink-0 overflow-hidden p-1">
              <img x-show="master.settings.logo_sekolah" :src="getLogoUrl()" alt="Logo"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                   class="w-full h-full object-contain">
              <div :style="master.settings.logo_sekolah ? 'display:none' : 'display:flex'"
                   class="w-full h-full rounded bg-amber-400 text-blue-950 items-center justify-center">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
            </div>
            <div class="whitespace-nowrap">
              <div class="font-bold text-white text-sm tracking-wide">e-Rapor SD 2026</div>
              <div class="text-[11px] text-blue-300" x-text="master.settings.tahun_ajaran + ' • Smt ' + master.settings.semester"></div>
            </div>
          </div>
          <button type="button" @click="sidebarOpen = false" class="md:hidden text-blue-300 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div class="p-4 border-b border-blue-900/80 bg-blue-900/20 whitespace-nowrap">
          <div class="text-xs text-blue-300 uppercase font-semibold tracking-wider mb-0.5" x-text="formatRole(user.role)"></div>
          <div class="text-sm font-bold text-white truncate" x-text="user.nama_lengkap"></div>
          <div class="text-xs text-blue-300 mt-0.5" x-text="'NIP/NIK: ' + (user.nip_nik || '-')"></div>
        </div>

        <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm whitespace-nowrap">
          <button @click="selectMenu('dashboard')"
                  :class="activeMenu === 'dashboard' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                  class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-gauge-high w-5 text-center"></i>
            <span>Dashboard</span>
          </button>

          <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-blue-400">Penilaian Rapor</div>

          <button @click="selectMenu('nilai_intra')"
                  :class="activeMenu === 'nilai_intra' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                  class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-pen-to-square w-5 text-center"></i>
            <span>1. Nilai Intra & Mulok</span>
          </button>

          <template x-if="user.role === 'wali_kelas' || user.role === 'admin'">
            <div class="space-y-1">
              <button @click="selectMenu('kokurikuler')"
                      :class="activeMenu === 'kokurikuler' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-cubes w-5 text-center"></i>
                <span>2. Kokurikuler (DPL)</span>
              </button>

              <button @click="selectMenu('ekskul')"
                      :class="activeMenu === 'ekskul' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-medal w-5 text-center"></i>
                <span>3. Ekstrakurikuler</span>
              </button>

              <button @click="selectMenu('wali_kelas')"
                      :class="activeMenu === 'wali_kelas' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-user-check w-5 text-center"></i>
                <span>4. Absensi & Catatan Wali</span>
              </button>

              <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-amber-400">Laporan Hasil Belajar</div>

              <button @click="selectMenu('cetak_rapor')"
                      :class="activeMenu === 'cetak_rapor' ? 'bg-amber-600 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-print w-5 text-center"></i>
                <span>5. Cetak Rapor PDF</span>
              </button>
            </div>
          </template>

          <template x-if="user.role === 'admin'">
            <div class="space-y-1">
              <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">Administrator</div>
              <button @click="selectMenu('statistik_admin'); loadAdminStats()"
                      :class="activeMenu === 'statistik_admin' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span>Statistik Progres</span>
              </button>
              <button @click="selectMenu('referensi')"
                      :class="activeMenu === 'referensi' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-school w-5 text-center"></i>
                <span>Data Referensi</span>
              </button>
            </div>
          </template>
        </nav>

        <div class="p-4 border-t border-blue-900 text-center text-[11px] text-blue-400 whitespace-nowrap">
          Kurikulum Merdeka • 2026
        </div>
      </aside>

      <!-- KONTEN KANAN -->
      <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between gap-3 shrink-0 no-print transition-colors">
          <!-- Kiri: Tombol Hamburger & Identitas Sekolah -->
          <div class="flex items-center gap-3 min-w-0">
            <button type="button" @click="sidebarOpen = !sidebarOpen" title="Buka/Tutup Menu Sidebar"
                    class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center transition shrink-0">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-sm font-bold text-slate-800 dark:text-white truncate" x-text="master.settings.nama_sekolah || 'SD ISLAM TERPADU'"></span>
              <span class="hidden lg:inline-block text-xs px-2.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 font-medium border border-blue-200 dark:border-blue-800 shrink-0"
                    x-text="'NPSN: ' + (master.settings.npsn || '-')"></span>
            </div>
          </div>

          <!-- Kanan: Jam Digital | Sinkron Data | Toggle Theme | Logout -->
          <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
            <!-- Jam Digital (di sebelah kiri Sinkron Data) -->
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 tabular-nums">
              <i class="fa-regular fa-clock text-blue-700 dark:text-blue-400"></i>
              <span x-text="digitalClock">00:00:00 WIB</span>
            </div>

            <!-- Sinkron Data -->
            <button @click="refreshMasterData()" title="Sinkronkan Data dari Google Sheets"
                    class="text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl font-medium flex items-center gap-1.5 transition">
              <i class="fa-solid fa-rotate text-blue-700 dark:text-blue-400"></i>
              <span class="hidden md:inline">Sinkron Data</span>
            </button>

            <!-- Tombol Ganti Tema (Light / Dark) -->
            <button type="button" @click="toggleTheme()" :title="darkMode ? 'Beralih ke Mode Terang (Light)' : 'Beralih ke Mode Gelap (Dark)'"
                    class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-amber-300 flex items-center justify-center transition">
              <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
            </button>

            <!-- Tombol Logout (di sebelah kanan Sinkron Data) -->
            <button @click="logout()" title="Keluar dari Aplikasi"
                    class="text-xs bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl font-semibold flex items-center gap-1.5 shadow-xs transition">
              <i class="fa-solid fa-power-off"></i>
              <span class="hidden sm:inline">Keluar</span>
            </button>
          </div>
        </header>

        <main class="flex-1 p-6 overflow-y-auto">

          <!-- =============================================================== -->
          <!-- TAB 1: DASHBOARD                                                -->
          <!-- =============================================================== -->
          <div x-show="activeMenu === 'dashboard'" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-800 to-blue-900 rounded-2xl p-6 text-white shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl font-bold">Selamat Datang, <span x-text="user.nama_lengkap"></span></h1>
                <p class="text-blue-200 text-sm mt-1">
                  e-Rapor Kurikulum Merdeka (Pendekatan Pembelajaran Mendalam) • Tahun Ajaran <span x-text="master.settings.tahun_ajaran || '-'"></span>
                </p>
              </div>
              <div class="bg-white/10 px-4 py-2.5 rounded-xl border border-white/20 text-xs">
                <div class="text-blue-200">Tanggal Rapor:</div>
                <div class="font-bold text-sm" x-text="formatTanggalIndo(master.settings.tanggal_rapor)"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-users"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Peserta Didik Ampuan</div>
                  <div class="text-2xl font-bold text-slate-800 dark:text-white" x-text="allowedSiswaCount()"></div>
                </div>
              </div>

              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-chalkboard"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Kelas Ampuan</div>
                  <div class="text-2xl font-bold text-slate-800 dark:text-white" x-text="allowedKelas().length"></div>
                </div>
              </div>

              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
