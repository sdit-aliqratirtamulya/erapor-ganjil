<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-RDA | e-Rapor Digital Al-Iqra</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    @keyframes marquee-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee-scroll 24s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    .rapor-page-number::after {
      content: "Halaman 1";
    }

    @media print {
      @page {
        margin: 12mm 14mm 18mm 14mm;
        @bottom-center {
          content: "Halaman " counter(page);
          font-family: 'Inter', sans-serif;
          font-size: 10px;
          font-weight: 500;
          color: #334155;
          vertical-align: top;
          padding-top: 6px;
        }
      }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .rapor-footer-fixed {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white !important;
      }
      .rapor-page-number {
        visibility: hidden !important;
      }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body x-data="eraporApp()" x-init="initApp()" :class="{ 'dark': darkMode }" class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">

  <!-- TOAST NOTIFICATION -->
  <div x-show="toast.show" x-cloak
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       :class="toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'"
       class="fixed bottom-5 right-5 z-50 text-white px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium no-print">
    <i :class="toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'" class="text-lg"></i>
    <span x-text="toast.message"></span>
  </div>

  <!-- LOADING OVERLAY -->
  <div x-show="loading" x-cloak class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex flex-col items-center justify-center no-print">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-3 border border-slate-200 dark:border-slate-700">
      <div class="w-10 h-10 border-4 border-blue-800 dark:border-blue-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-200" x-text="loadingText">Memproses data ke server...</p>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- HALAMAN LOGIN                                                         -->
  <!-- ===================================================================== -->
  <template x-if="!user">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-950 via-blue-900 to-slate-900 p-4 relative">
      <!-- Tombol Ganti Tema di Halaman Login -->
      <button type="button" @click="toggleTheme()" title="Ganti Tema Light/Dark"
              class="absolute top-5 right-5 w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center transition">
        <i :class="darkMode ? 'fa-solid fa-sun text-amber-300' : 'fa-solid fa-moon text-blue-200'"></i>
      </button>

      <div class="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 border border-transparent dark:border-slate-800">
        
        <div class="md:col-span-5 bg-blue-800 text-white p-8 flex flex-col justify-between relative overflow-hidden">
          <div class="relative z-10">
            <div class="inline-flex items-center gap-2 bg-blue-700/70 px-3 py-1 rounded-full text-xs font-semibold tracking-wide mb-6 border border-blue-500/40">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              KURIKULUM MERDEKA • 2026
            </div>
            <h1 class="text-2xl font-bold leading-snug mb-2">e-RDA 2026</h1>
            <p class="text-blue-200 text-sm leading-relaxed">
              e-RDA adalah e-Rapor Digital Al-Iqra. Aplikasi yang dibangun dan dikembangkan oleh Tim IT SDIT Al-Iqra untuk membantu dewan guru dalam penginputan nilai Rapor.
            </p>
          </div>

          <div class="relative z-10 space-y-3 my-8 text-xs text-blue-100">
            <div class="flex items-center gap-3 bg-blue-900/50 p-3 rounded-xl border border-blue-700/50">
              <i class="fa-solid fa-book-open-reader text-amber-400 text-base"></i>
              <span>CP Kepka BKPDM No. 020/2026 & BSKAP No. 046/H/KR/2025</span>
            </div>
            <div class="flex items-center gap-3 bg-blue-900/50 p-3 rounded-xl border border-blue-700/50">
              <i class="fa-solid fa-wand-magic-sparkles text-emerald-400 text-base"></i>
              <span>Deskripsi Rapor Otomatis Berbasis Predikat Nilai</span>
            </div>
          </div>

          <div class="relative z-10 text-xs text-blue-300">
            &copy; 2026 | Tim IT SDIT AL-IQRA
          </div>
        </div>

        <div class="md:col-span-7 p-8 md:p-10 flex flex-col justify-center">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Masuk ke Aplikasi</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Gunakan akun Wali Kelas, Guru Mapel Tahfizh, atau Admin.</p>
          </div>

          <div class="mb-5 bg-slate-50 dark:bg-slate-800/70 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-server text-blue-700 dark:text-blue-400"></i> URL Web App Google Apps Script
              </label>
              <button type="button" @click="showApiInput = !showApiInput" class="text-xs text-blue-700 dark:text-blue-400 hover:underline font-medium">
                <span x-text="showApiInput ? 'Sembunyikan' : 'Ubah URL'"></span>
              </button>
            </div>
            <div x-show="showApiInput" class="mt-2">
              <input type="url" x-model="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"
                     class="w-full text-xs px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>
            <div x-show="!showApiInput" class="text-xs text-emerald-700 dark:text-emerald-400 font-medium truncate">
              <i class="fa-solid fa-link mr-1"></i> <span x-text="apiUrl || 'Belum diatur (Klik Ubah URL)'"></span>
            </div>
          </div>

          <form @submit.prevent="login()" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                  <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" x-model="loginForm.username" required placeholder="Masukkan username akun Anda"
                       class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-blue-700 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" x-model="loginForm.password" required placeholder="••••••••"
                       class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-blue-700 focus:outline-none">
              </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm mt-3">
              <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
            </button>
          </form>
        </div>

      </div>
    </div>
  </template>

  <!-- ===================================================================== -->
  <!-- WORKSPACE UTAMA                                                       -->
  <!-- ===================================================================== -->
  <template x-if="user">
    <div class="min-h-screen flex flex-col md:flex-row relative">

      <!-- BACKDROP SIDEBAR MOBILE -->
      <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"
           class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 md:hidden no-print"></div>

      <!-- SIDEBAR -->
      <aside :class="sidebarOpen ? 'translate-x-0 md:w-64' : '-translate-x-full md:translate-x-0 md:w-0 md:overflow-hidden'"
             class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-blue-950 text-slate-200 flex flex-col shrink-0 transition-all duration-300 ease-in-out no-print">
        <div class="h-16 px-5 flex items-center justify-between bg-blue-900/60 border-b border-blue-800/60 shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-bold text-lg shadow shrink-0">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="whitespace-nowrap">
              <div class="font-bold text-white text-sm tracking-wide">e-Rapor SD 2026</div>
              <div class="text-[11px] text-blue-300" x-text="master.settings.tahun_ajaran + ' • Smt ' + master.settings.semester"></div>
            </div>
          </div>
          <button type="button" @click="sidebarOpen = false" class="md:hidden text-blue-300 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div class="p-4 border-b border-blue-900/80 bg-blue-900/20 whitespace-nowrap">
          <div class="text-xs text-blue-300 uppercase font-semibold tracking-wider mb-0.5" x-text="formatRole(user.role)"></div>
          <div class="text-sm font-bold text-white truncate" x-text="user.nama_lengkap"></div>
          <div class="text-xs text-blue-300 mt-0.5" x-text="'NIP/NIK: ' + (user.nip_nik || '-')"></div>
        </div>

        <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm whitespace-nowrap">
          <button @click="selectMenu('dashboard')"
                  :class="activeMenu === 'dashboard' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                  class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-gauge-high w-5 text-center"></i>
            <span>Dashboard</span>
          </button>

          <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-blue-400">Penilaian Rapor</div>

          <button @click="selectMenu('nilai_intra')"
                  :class="activeMenu === 'nilai_intra' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                  class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-pen-to-square w-5 text-center"></i>
            <span>1. Nilai Intra & Mulok</span>
          </button>

          <template x-if="user.role === 'wali_kelas' || user.role === 'admin'">
            <div class="space-y-1">
              <button @click="selectMenu('kokurikuler')"
                      :class="activeMenu === 'kokurikuler' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-cubes w-5 text-center"></i>
                <span>2. Kokurikuler (DPL)</span>
              </button>

              <button @click="selectMenu('ekskul')"
                      :class="activeMenu === 'ekskul' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-medal w-5 text-center"></i>
                <span>3. Ekstrakurikuler</span>
              </button>

              <button @click="selectMenu('wali_kelas')"
                      :class="activeMenu === 'wali_kelas' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-user-check w-5 text-center"></i>
                <span>4. Absensi & Catatan Wali</span>
              </button>

              <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-amber-400">Laporan Hasil Belajar</div>

              <button @click="selectMenu('cetak_rapor')"
                      :class="activeMenu === 'cetak_rapor' ? 'bg-amber-600 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-print w-5 text-center"></i>
                <span>5. Cetak Rapor PDF</span>
              </button>
            </div>
          </template>

          <template x-if="user.role === 'admin'">
            <div>
              <div class="pt-3 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">Administrator</div>
              <button @click="selectMenu('referensi')"
                      :class="activeMenu === 'referensi' ? 'bg-blue-700 text-white font-semibold shadow-sm' : 'text-blue-200 hover:bg-blue-900/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-school w-5 text-center"></i>
                <span>Data Referensi</span>
              </button>
            </div>
          </template>
        </nav>

        <div class="p-4 border-t border-blue-900 text-center text-[11px] text-blue-400 whitespace-nowrap">
          Kurikulum Merdeka • 2026
        </div>
      </aside>

      <!-- KONTEN KANAN -->
      <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between gap-3 shrink-0 no-print transition-colors">
          <!-- Kiri: Tombol Hamburger & Identitas Sekolah -->
          <div class="flex items-center gap-3 min-w-0">
            <button type="button" @click="sidebarOpen = !sidebarOpen" title="Buka/Tutup Menu Sidebar"
                    class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center transition shrink-0">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-sm font-bold text-slate-800 dark:text-white truncate" x-text="master.settings.nama_sekolah || 'SD ISLAM TERPADU'"></span>
              <span class="hidden lg:inline-block text-xs px-2.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 font-medium border border-blue-200 dark:border-blue-800 shrink-0"
                    x-text="'NPSN: ' + (master.settings.npsn || '-')"></span>
            </div>
          </div>

          <!-- Kanan: Jam Digital | Sinkron Data | Toggle Theme | Logout -->
          <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
            <!-- Jam Digital (di sebelah kiri Sinkron Data) -->
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 tabular-nums">
              <i class="fa-regular fa-clock text-blue-700 dark:text-blue-400"></i>
              <span x-text="digitalClock">00:00:00 WIB</span>
            </div>

            <!-- Sinkron Data -->
            <button @click="refreshMasterData()" title="Sinkronkan Data dari Google Sheets"
                    class="text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl font-medium flex items-center gap-1.5 transition">
              <i class="fa-solid fa-rotate text-blue-700 dark:text-blue-400"></i>
              <span class="hidden md:inline">Sinkron Data</span>
            </button>

            <!-- Tombol Ganti Tema (Light / Dark) -->
            <button type="button" @click="toggleTheme()" :title="darkMode ? 'Beralih ke Mode Terang (Light)' : 'Beralih ke Mode Gelap (Dark)'"
                    class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-amber-300 flex items-center justify-center transition">
              <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
            </button>

            <!-- Tombol Logout (di sebelah kanan Sinkron Data) -->
            <button @click="logout()" title="Keluar dari Aplikasi"
                    class="text-xs bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl font-semibold flex items-center gap-1.5 shadow-xs transition">
              <i class="fa-solid fa-power-off"></i>
              <span class="hidden sm:inline">Keluar</span>
            </button>
          </div>
        </header>

        <main class="flex-1 p-6 overflow-y-auto">

          <!-- =============================================================== -->
          <!-- TAB 1: DASHBOARD                                                -->
          <!-- =============================================================== -->
          <div x-show="activeMenu === 'dashboard'" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-800 to-blue-900 rounded-2xl p-6 text-white shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl font-bold">Selamat Datang, <span x-text="user.nama_lengkap"></span></h1>
                <p class="text-blue-200 text-sm mt-1">
                  e-Rapor Kurikulum Merdeka (Pendekatan Pembelajaran Mendalam) • Tahun Ajaran <span x-text="master.settings.tahun_ajaran || '-'"></span>
                </p>
              </div>
              <div class="bg-white/10 px-4 py-2.5 rounded-xl border border-white/20 text-xs">
                <div class="text-blue-200">Tanggal Rapor:</div>
                <div class="font-bold text-sm" x-text="formatTanggalIndo(master.settings.tanggal_rapor)"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-users"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Peserta Didik Ampuan</div>
                  <div class="text-2xl font-bold text-slate-800 dark:text-white" x-text="allowedSiswaCount()"></div>
                </div>
              </div>

              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-chalkboard"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Kelas Ampuan</div>
                  <div class="text-2xl font-bold text-slate-800 dark:text-white" x-text="allowedKelas().length"></div>
                </div>
              </div>

              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Total Mata Pelajaran</div>
                  <div class="text-2xl font-bold text-slate-800 dark:text-white" x-text="master.mapel.length"></div>
                </div>
              </div>

              <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-400 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Fase Pembelajaran</div>
                  <div class="text-lg font-bold text-slate-800 dark:text-white">Fase A, B, C</div>
                </div>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-xs space-y-3 text-sm">
              <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-blue-700 dark:text-blue-400"></i> Informasi Pemetaan Otomatis &amp; Referensi CP 2026
              </h3>

        async initApp() {
          this.startClock();
          if (this.user && this.apiUrl) {
            await this.refreshMasterData();
          }
        },

        toggleTheme() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('erapor_theme', this.darkMode ? 'dark' : 'light');
        },

        selectMenu(menu) {
          this.activeMenu = menu;
          if (window.innerWidth < 768) {
            this.sidebarOpen = false;
          }
        },

        startClock() {
          const update = () => {
            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            const detik = String(now.getSeconds()).padStart(2, '0');
            this.digitalClock = `${jam}:${menit}:${detik} WIB`;
          };
          update();
          if (this.clockInterval) clearInterval(this.clockInterval);
          this.clockInterval = setInterval(update, 1000);
        },

        formatTanggalIndo(rawVal) {
          if (!rawVal) return '-';
          const bulanIndo = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
          ];

          // Jika sudah berformat "19 Desember 2026"
          const str = String(rawVal).trim();
          if (/^\d{1,2}\s+[A-Za-z]+\s+\d{4}$/.test(str)) {
            return str;
          }

          // Jika berformat DD/MM/YYYY atau DD-MM-YYYY
          const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
          if (dmyMatch) {
            const d = parseInt(dmyMatch[1], 10);
            const m = parseInt(dmyMatch[2], 10) - 1;
            const y = dmyMatch[3];
            if (bulanIndo[m]) return `${d} ${bulanIndo[m]} ${y}`;
          }

          // Jika berformat ISO Date (contoh dari Google Sheets: 2026-12-18T17:00:00.000Z atau YYYY-MM-DD)
          const parsed = new Date(str);
          if (!isNaN(parsed.getTime())) {
            const d = parsed.getDate();
            const m = bulanIndo[parsed.getMonth()];
            const y = parsed.getFullYear();
            return `${d} ${m} ${y}`;
          }

          return str;
        },

        notify(message, type = 'success') {
          this.toast = { show: true, message, type };
          setTimeout(() => { this.toast.show = false; }, 3500);
        },

        async callApi(action, payload = {}) {
          if (!this.apiUrl) throw new Error('URL Web App Google Apps Script belum diisi!');
          const response = await fetch(this.apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
          const resJson = await response.json();
          if (resJson.status !== 'success') throw new Error(resJson.message || 'Kesalahan server');
          return resJson;
        },

        async login() {
          if (!this.apiUrl) {
            this.showApiInput = true;
            return this.notify('Silakan masukkan URL Web App GAS terlebih dahulu.', 'error');
          }
          this.loading = true;
          this.loadingText = 'Bismillah, cek dulu ya...';
          try {
            localStorage.setItem('erapor_gas_url', this.apiUrl.trim());
            const res = await this.callApi('LOGIN', this.loginForm);
            this.user = res.user;
            localStorage.setItem('erapor_user', JSON.stringify(res.user));
            await this.refreshMasterData();
            this.notify('Yey, berhasil! Selamat datang, ' + res.user.nama_lengkap);
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

          localStorage.removeItem('erapor_user');

            this.master = {
              ...this.master,
              ...res.data,
              settings: { ...this.master.settings, ...(res.data.settings || {}) }
            };

            const klsList = this.allowedKelas();
            if (klsList.length > 0) {
              const waliKlsId = String(this.user.kelas_wali || '').trim();
              if (this.user.role === 'wali_kelas' && waliKlsId) {
                this.selectedKelas = waliKlsId;
              } else if (!this.selectedKelas || !klsList.some(k => String(k.id_kelas).trim() === String(this.selectedKelas).trim())) {
                this.selectedKelas = String(klsList[0].id_kelas).trim();
              }
              await this.onKelasChange();
            }
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        formatRole(role) {
          const map = {
            admin: 'Administrator Sekolah',
            wali_kelas: 'Wali Kelas',
            guru_mapel: 'Guru Mata Pelajaran'
          };
          return map[role] || role;
        },

        // Filter Kelas Otomatis sesuai Wali Kelas atau Plotting Guru Tahfizh (1A-3B / 4A-6B)
        allowedKelas() {
          if (this.user.role === 'admin') return this.master.kelas;
          if (this.user.role === 'wali_kelas') {
            const uKelas = String(this.user.kelas_wali || '').trim();
            const uId = String(this.user.id_user || '').trim();
            return this.master.kelas.filter(k =>
              String(k.id_kelas).trim() === uKelas || String(k.id_wali_kelas).trim() === uId
            );
          }
          const uId = String(this.user.id_user || '').trim();
          const plotKelasIds = this.master.plotting
            .filter(p => String(p.id_guru).trim() === uId)
            .map(p => String(p.id_kelas).trim());
          return this.master.kelas.filter(k => plotKelasIds.includes(String(k.id_kelas).trim()));
        },

        allowedSiswaCount() {
          const klsIds = this.allowedKelas().map(k => String(k.id_kelas).trim());
          return this.master.siswa.filter(s => klsIds.includes(String(s.id_kelas).trim())).length;
        },

        // Filter Mata Pelajaran sesuai Fase Kelas (Fase A tanpa IPAS) dan Role Guru
        allowedMapel() {
          const selKls = String(this.selectedKelas || '').trim();
          const kls = this.master.kelas.find(k => String(k.id_kelas).trim() === selKls);
          const fase = kls ? String(kls.fase).trim() : '';

          let list = this.master.mapel.filter(m => {
            if (!fase) return true;
            const berlaku = String(m.fase_berlaku || 'A,B,C').split(',').map(x => x.trim());
            return berlaku.includes(fase);
          });

          if (this.user.role === 'guru_mapel') {
            const uId = String(this.user.id_user || '').trim();
            const plotMapelIds = this.master.plotting
              .filter(p => String(p.id_guru).trim() === uId && (!selKls || String(p.id_kelas).trim() === selKls))
              .map(p => String(p.id_mapel).trim());
            list = list.filter(m => plotMapelIds.includes(String(m.id_mapel).trim()));
          }

          return list.sort((a, b) => Number(a.urutan_cetak) - Number(b.urutan_cetak));
        },

        siswaInSelectedKelas() {
          const selKls = String(this.selectedKelas || '').trim();
          return this.master.siswa.filter(s => String(s.id_kelas).trim() === selKls);
        },

        async onKelasChange() {
          const mapels = this.allowedMapel();
          if (mapels.length > 0 && !mapels.some(m => String(m.id_mapel).trim() === String(this.selectedMapel).trim())) {
            this.selectedMapel = String(mapels[0].id_mapel).trim();
          }
          await this.loadNilaiKelas();
        },

        async loadNilaiKelas() {
          if (!this.selectedKelas) return;
          this.loading = true;
          this.loadingText = 'Memuat daftar peserta didik & nilai...';
          try {
            const res = await this.callApi('GET_NILAI_KELAS', {
              tahun_ajaran: this.master.settings.tahun_ajaran,
              semester: this.master.settings.semester,
              id_kelas: this.selectedKelas
            });
            this.kelasData = res.data;
            this.prepareFormNilaiIntra();
            this.prepareFormKokurikuler();
            this.prepareFormWali();
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        prepareFormNilaiIntra() {
          const siswaList = this.siswaInSelectedKelas();
          const selMpl = String(this.selectedMapel || '').trim();
          this.formNilaiIntra = siswaList.map(s => {
            const sId = String(s.id_siswa).trim();
            const ex = this.kelasData.nilaiIntra.find(n => String(n.id_siswa).trim() === sId && String(n.id_mapel).trim() === selMpl);
            return {
              id_nilai: ex?.id_nilai || '',
              id_siswa: sId,
              nis: s.nis,
              nisn: s.nisn,
              nama_siswa: s.nama_siswa,
              nilai_akhir: ex?.nilai_akhir !== undefined ? ex.nilai_akhir : '',
              predikat: ex?.predikat || '',
              deskripsi_otomatis: ex?.deskripsi_otomatis || ''
            };
          });
        },

        // Konversi Nilai -> Predikat Otomatis & Deskripsi CP 2025/2026 Spesifik per Tingkat Kelas (1–6)
        updatePredikatDanDeskripsi(row) {
          const val = Number(row.nilai_akhir);
          if (row.nilai_akhir === '' || row.nilai_akhir === null || isNaN(val)) {
            row.predikat = '';
            row.deskripsi_otomatis = '';
            return;
          }

          let predikat = 'D';
          if (val >= 90) predikat = 'A';
          else if (val >= 80) predikat = 'B';
          else if (val >= 70) predikat = 'C';
          row.predikat = predikat;

          const selKls = String(this.selectedKelas || '').trim();
          const kls = this.master.kelas.find(k => String(k.id_kelas).trim() === selKls);

          // Ambil tingkat kelas (1-6) dari kolom tingkat atau dari karakter angka pertama nama_kelas (misal: "1A" -> 1)
          let tingkat = kls ? parseInt(String(kls.tingkat || '').trim(), 10) : NaN;
          if (isNaN(tingkat) && kls && kls.nama_kelas) {
            const matchAngka = String(kls.nama_kelas).match(/\d+/);
            if (matchAngka) tingkat = parseInt(matchAngka[0], 10);
          }
          if (isNaN(tingkat) || tingkat < 1 || tingkat > 6) {
            const faseFallback = kls ? String(kls.fase).trim() : 'A';
            tingkat = faseFallback === 'A' ? 1 : (faseFallback === 'B' ? 3 : 5);
          }

          const cpObj = CP_BANK_2026[String(this.selectedMapel).trim()];
          const cpText = (cpObj && cpObj[tingkat]) ? cpObj[tingkat] : `memahami dan menerapkan materi pembelajaran kelas ${tingkat} sesuai capaian pembelajaran`;

          const templateNarasi = {
            A: `Menunjukkan penguasaan yang sangat baik dan mendalam dalam ${cpText}.`,
            B: `Menunjukkan penguasaan yang baik dalam ${cpText}.`,
            C: `Cukup menguasai dalam ${cpText}, namun perlu pembiasaan dan latihan lebih lanjut agar semakin optimal.`,
            D: `Perlu bimbingan dan pendampingan khusus dalam ${cpText}.`
          };

          row.deskripsi_otomatis = templateNarasi[predikat];
        },

        getLabelPredikat(p) {
          const labels = { A: 'Sangat Baik', B: 'Baik', C: 'Cukup', D: 'Perlu Bimbingan' };
          return labels[p] || '';
        },

        async saveNilaiIntraBatch() {
          this.loading = true;
          this.loadingText = 'Menyimpan nilai mata pelajaran...';
          try {
            const validRecords = this.formNilaiIntra.filter(r => r.nilai_akhir !== '');
            await this.callApi('SAVE_NILAI_BATCH', {
              tahun_ajaran: this.master.settings.tahun_ajaran,
              semester: this.master.settings.semester,
              id_mapel: this.selectedMapel,
              records: validRecords
            });
            await this.loadNilaiKelas();
            this.notify('Nilai dan deskripsi otomatis berhasil disimpan!');
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // KOKURIKULER (4 DIMENSI PROFIL LULUSAN)
        prepareFormKokurikuler() {
          const siswaList = this.siswaInSelectedKelas();
          this.formKokurikuler = siswaList.map(s => {
            const sId = String(s.id_siswa).trim();
            const ex = this.kelasData.nilaiKokurikuler.find(k => String(k.id_siswa).trim() === sId);
            let dimObj = {};
            this.dimensiList.forEach(d => { dimObj[d.key] = 'Berkembang Sesuai Harapan (BSH)'; });
            if (ex?.dimensi_json) {
              try {
                const parsed = JSON.parse(ex.dimensi_json);
                this.dimensiList.forEach(d => {
                  if (parsed[d.key]) dimObj[d.key] = parsed[d.key];
                });
              } catch (e) {}
            }
            if (ex?.tema_projek) this.temaKokurikulerGlobal = ex.tema_projek;

            const row = {
              id_kokurikuler: ex?.id_kokurikuler || '',
              id_siswa: sId,
              nis: s.nis,
              nama_siswa: s.nama_siswa,
              tema_projek: ex?.tema_projek || this.temaKokurikulerGlobal,
              dimensi: dimObj,
              catatan_kokurikuler: ex?.catatan_kokurikuler || ''
            };
            if (!row.catatan_kokurikuler) this.generateCatatanKokurikuler(row);
            return row;
          });
        },

        syncTemaKokurikuler() {
          this.formKokurikuler.forEach(r => { r.tema_projek = this.temaKokurikulerGlobal; });
        },

        generateCatatanKokurikuler(row) {
          const sbList = [];
          const bshList = [];
          const perluBimbinganList = [];

          const mapDisiplinIlmu = {
            keimanan: 'nilai-nilai keagamaan dan pembiasaan ibadah (PAI, Al-Qur\'an Hadits, Akidah Akhlak, Fikih, BTQ, dan Tahfizh)',
            penalaran_kritis: 'pemecahan masalah dan literasi-numerasi (Matematika, IPAS, dan Bahasa Indonesia)',
            kreativitas: 'ekspresi karya dan komunikasi budaya (SBdP, Bahasa Sunda, dan Bahasa Inggris)',
            kemandirian: 'tanggung jawab, kedisiplinan, dan ketangguhan diri (Pendidikan Pancasila, PJOK, dan Bahasa Arab)'
          };

          const kekuatanDisiplin = [];

          this.dimensiList.forEach(d => {
            const cleanName = d.label.replace(/^\d+\.\s*/, '');
            const status = row.dimensi[d.key];
            if (status === 'Sangat Berkembang (SB)') {
              sbList.push(cleanName);
              kekuatanDisiplin.push(mapDisiplinIlmu[d.key]);
            } else if (status === 'Berkembang Sesuai Harapan (BSH)') {
              bshList.push(cleanName);
              kekuatanDisiplin.push(mapDisiplinIlmu[d.key]);
            } else {
              perluBimbinganList.push(cleanName);
            }
          });

          const temaAktif = (row.tema_projek || this.temaKokurikulerGlobal || 'Projek Penguatan Dimensi Profil Lulusan').trim();
          let kalimat = [];

          if (sbList.length > 0) {
            kalimat.push(`Dalam kegiatan kokurikuler "${temaAktif}", murid menunjukkan capaian Sangat Berkembang pada dimensi ${sbList.join(', ')}.`);
          }
          if (bshList.length > 0) {
            kalimat.push(`Murid menunjukkan capaian Berkembang Sesuai Harapan pada dimensi ${bshList.join(', ')}.`);
          }
          if (kekuatanDisiplin.length > 0) {
            kalimat.push(`Murid mampu mengintegrasikan kompetensi lintas disiplin ilmu secara nyata, khususnya dalam ${kekuatanDisiplin.slice(0, 2).join(' serta ')}.`);
          }
          if (perluBimbinganList.length > 0) {
            kalimat.push(`Perlu pendampingan dan pembiasaan berkelanjutan pada dimensi ${perluBimbinganList.join(', ')}.`);
          }

          row.catatan_kokurikuler = kalimat.join(' ');
        },

        applyRekomendasiKokurikulerLintasDisiplin() {
          if (!this.selectedKelas || this.formKokurikuler.length === 0) return;

          const rumpunMapel = {
            keimanan: ['MPL_PAI', 'MPL_QH', 'MPL_AA', 'MPL_FIKIH', 'MPL_BTQ', 'MPL_TAHFIZH'],
            penalaran_kritis: ['MPL_MTK', 'MPL_IPAS', 'MPL_BINDO'],
            kreativitas: ['MPL_SBDP', 'MPL_SUNDA', 'MPL_BING'],
            kemandirian: ['MPL_PJOK', 'MPL_PPKN', 'MPL_BARAB']
          };

          const konversiPredikatDimensi = (rataRata) => {
            if (rataRata === null) return 'Berkembang Sesuai Harapan (BSH)';
            if (rataRata >= 90) return 'Sangat Berkembang (SB)';
            if (rataRata >= 80) return 'Berkembang Sesuai Harapan (BSH)';
            if (rataRata >= 70) return 'Sedang Berkembang (SDB)';
            return 'Mulai Berkembang (MB)';
          };

          let siswaTerproses = 0;

          this.formKokurikuler.forEach(row => {
            const sId = String(row.id_siswa).trim();
            const nilaiSiswa = this.kelasData.nilaiIntra.filter(n => String(n.id_siswa).trim() === sId);

            if (nilaiSiswa.length > 0) siswaTerproses++;

            Object.keys(rumpunMapel).forEach(dimKey => {
              const targetIds = rumpunMapel[dimKey];
              const skorList = nilaiSiswa
                .filter(n => targetIds.includes(String(n.id_mapel).trim()) && n.nilai_akhir !== '' && !isNaN(Number(n.nilai_akhir)))
                .map(n => Number(n.nilai_akhir));

              const avg = skorList.length > 0
                ? skorList.reduce((acc, v) => acc + v, 0) / skorList.length
                : null;

              row.dimensi[dimKey] = konversiPredikatDimensi(avg);
            });

            this.generateCatatanKokurikuler(row);
          });

          if (siswaTerproses === 0) {
            this.notify('Belum ada nilai Intra/Mulok yang tersimpan di kelas ini. Default BSH diterapkan.', 'error');
          } else {
            this.notify(`Rekomendasi kokurikuler lintas disiplin berhasil disusun untuk ${siswaTerproses} murid!`);
          }
        },

        async saveKokurikulerBatch() {
          this.syncTemaKokurikuler();
          this.loading = true;
          this.loadingText = 'Menyimpan penilaian Kokurikuler...';
          try {
            await this.callApi('SAVE_KOKURIKULER_BATCH', {
              tahun_ajaran: this.master.settings.tahun_ajaran,
              semester: this.master.settings.semester,
              records: this.formKokurikuler
            });
            await this.loadNilaiKelas();
            this.notify('Penilaian Kokurikuler (Dimensi Profil Lulusan) berhasil disimpan!');
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // EKSTRAKURIKULER & WALI KELAS
        hitungPeringkatKelas() {
          const siswaList = this.siswaInSelectedKelas();
          const rekap = siswaList.map(s => {
            const sId = String(s.id_siswa).trim();
            const nilaiSiswa = this.kelasData.nilaiIntra.filter(
              n => String(n.id_siswa).trim() === sId && n.nilai_akhir !== '' && !isNaN(Number(n.nilai_akhir))
            );
            const total = nilaiSiswa.reduce((sum, n) => sum + Number(n.nilai_akhir), 0);
            const rata = nilaiSiswa.length > 0 ? total / nilaiSiswa.length : 0;
            return {
              id_siswa: sId,
              total,
              rata,
              jumlahMapel: nilaiSiswa.length
            };
          });

          // Urutkan berdasarkan total nilai tertinggi, lalu rata-rata tertinggi
          const sorted = [...rekap].sort((a, b) => b.total - a.total || b.rata - a.rata);
          const rankMap = {};
          sorted.forEach((item, idx) => {
            rankMap[item.id_siswa] = {
              peringkat: item.jumlahMapel > 0 ? idx + 1 : null,
              total: item.total,
              rata: item.rata,
              totalSiswa: siswaList.length
            };
          });
          return rankMap;
        },

        generateCatatanWaliRow(row) {
          const totalSiswa = this.formWali.length || 1;
          const rank = row.peringkat;
          const rata = row.rataNilai || 0;
          const sakit = Number(row.sakit) || 0;
          const izin = Number(row.izin) || 0;
          const alpa = Number(row.alpa) || 0;
          const totalAbsen = sakit + izin + alpa;

          // 1. Narasi berdasarkan peringkat & capaian akademik
          let kalimatAkademik = '';
          if (rank === 1) {
            kalimatAkademik = `Alhamdulillah, ananda ${row.nama_siswa} meraih prestasi gemilang dengan menempati peringkat ke-1 dari ${totalSiswa} murid di kelas. Pertahankan semangat belajar, kerendahan hati, dan jadilah teladan kebaikan bagi teman-teman.`;
          } else if (rank === 2 || rank === 3) {
            kalimatAkademik = `Selamat atas pencapaian luar biasa ananda ${row.nama_siswa} yang berhasil meraih peringkat ke-${rank} dari ${totalSiswa} murid di kelas. Terus pertahankan konsistensi belajar dan tingkatkan potensi diri di semester berikutnya.`;
          } else if (rank && rank <= 10) {
            kalimatAkademik = `Ananda ${row.nama_siswa} menunjukkan perkembangan belajar yang sangat baik dengan menempati peringkat ke-${rank} dari ${totalSiswa} murid. Terus tingkatkan ketekunan dan fokus belajar agar dapat meraih hasil yang lebih optimal.`;
          } else if (rank) {
            kalimatAkademik = `Ananda ${row.nama_siswa} menunjukkan perkembangan belajar yang positif (peringkat ke-${rank} dari ${totalSiswa} murid). Terus tingkatkan motivasi belajar, kedisiplinan mengulang pelajaran di rumah, dan keberanian bertanya di kelas.`;
          } else {
            kalimatAkademik = `Ananda ${row.nama_siswa} menunjukkan semangat belajar dan perkembangan karakter yang baik selama semester ini.`;
          }

          // 2. Narasi berdasarkan kehadiran (Sakit, Izin, Alpa)
          let kalimatKehadiran = '';
          if (totalAbsen === 0) {
            kalimatKehadiran = ' Tingkat kehadiran ananda sangat membanggakan (hadir 100% tanpa absen), mencerminkan kedisiplinan dan tanggung jawab yang tinggi.';
          } else if (alpa === 0 && sakit > 0 && izin === 0) {
            kalimatKehadiran = ` Ketidakhadiran ananda selama ${sakit} hari disebabkan oleh faktor kesehatan (sakit); semoga Allah Swt. senantiasa menganugerahkan kesehatan dan kekuatan agar ananda dapat mengikuti pembelajaran dengan optimal.`;
          } else if (alpa === 0) {
            kalimatKehadiran = ` Kehadiran ananda tergolong baik dengan keterangan sakit ${sakit} hari dan izin ${izin} hari.`;
          } else if (alpa <= 2) {
            kalimatKehadiran = ` Diharapkan ananda dan orang tua dapat lebih memperhatikan kedisiplinan kehadiran di sekolah (tercatat ${alpa} hari tanpa keterangan) agar tidak tertinggal materi pembelajaran.`;
          } else {
            kalimatKehadiran = ` Perlu perhatian dan kerja sama lebih erat antara orang tua dan sekolah terkait kedisiplinan kehadiran ananda (tercatat ${alpa} hari tanpa keterangan) demi kelancaran proses belajar ananda.`;
          }

          row.catatan_wali = (kalimatAkademik + kalimatKehadiran).trim();
        },

        generateSemuaCatatanWali() {
          if (!this.selectedKelas || this.formWali.length === 0) return;
          const rankMap = this.hitungPeringkatKelas();
          let adaNilai = false;

          this.formWali.forEach(row => {
            const info = rankMap[row.id_siswa];
            if (info && info.peringkat) {
              row.peringkat = info.peringkat;
              row.rataNilai = info.rata;
              adaNilai = true;
            }
            this.generateCatatanWaliRow(row);
          });

          if (!adaNilai) {
            this.notify('Catatan berdasarkan kehadiran dibuat (nilai mapel belum diinput sehingga peringkat belum tersedia).', 'error');
          } else {
            this.notify('Catatan wali kelas otomatis berdasarkan peringkat & kehadiran berhasil dibuat!');
          }
        },

        prepareFormWali() {
          const siswaList = this.siswaInSelectedKelas();
          const rankMap = this.hitungPeringkatKelas();
          this.formWali = siswaList.map(s => {
            const sId = String(s.id_siswa).trim();
            const ex = this.kelasData.dataWali.find(w => String(w.id_siswa).trim() === sId);
            const rankInfo = rankMap[sId] || { peringkat: null, rata: 0 };
            let pilihan = [];
            let prestasiPramuka = '';
            if (ex?.ekskul_pilihan_json) {
              try {
                const parsed = JSON.parse(ex.ekskul_pilihan_json);
                if (Array.isArray(parsed)) {
                  const pramukaMeta = parsed.find(item => item.is_wajib_pramuka);
                  if (pramukaMeta) prestasiPramuka = pramukaMeta.prestasi || '';
                  pilihan = parsed.filter(item => !item.is_wajib_pramuka);
                }
              } catch (e) { pilihan = []; }
            }
            const row = {
              id_catatan: ex?.id_catatan || '',
              id_siswa: sId,
              nama_siswa: s.nama_siswa,
              peringkat: rankInfo.peringkat,
              rataNilai: rankInfo.rata,
              sakit: ex?.sakit || 0,
              izin: ex?.izin || 0,
              alpa: ex?.alpa || 0,
              ekskul_wajib: ex?.ekskul_wajib || 'Baik',
              prestasi_pramuka: prestasiPramuka,
              ekskul_pilihan: pilihan,
              catatan_wali: ex?.catatan_wali || '',
              status_naik: ex?.status_naik || '-'
            };
            if (!row.catatan_wali) {
              this.generateCatatanWaliRow(row);
            }
            return row;
          });
        },

        async saveWaliBatch() {
          this.loading = true;
          this.loadingText = 'Menyimpan data Ekstrakurikuler & Wali Kelas...';
          try {
            const payloadRecords = this.formWali.map(r => {
              const combinedPilihan = [...(r.ekskul_pilihan || [])];
              if (r.prestasi_pramuka && String(r.prestasi_pramuka).trim() !== '') {
                combinedPilihan.unshift({
                  nama: 'Pramuka (Ekstrakurikuler Wajib)',
                  predikat: r.ekskul_wajib || 'Baik',
                  prestasi: String(r.prestasi_pramuka).trim(),
                  is_wajib_pramuka: true
                });
              }
              return {
                ...r,
                ekskul_pilihan: combinedPilihan
              };
            });

            await this.callApi('SAVE_WALI_BATCH', {
              tahun_ajaran: this.master.settings.tahun_ajaran,
              semester: this.master.settings.semester,
              records: payloadRecords
            });
            await this.loadNilaiKelas();
            this.notify('Data Ekstrakurikuler & Wali Kelas berhasil disimpan!');
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // CETAK RAPOR
        async loadRaporSiswa() {
          if (!this.selectedSiswaPrint) {
            this.raporData = null;
            return;
          }
          this.loading = true;
          this.loadingText = 'Menyusun lembar rapor...';
          try {
            const res = await this.callApi('GET_RAPOR_SISWA', {
              tahun_ajaran: this.master.settings.tahun_ajaran,
              semester: this.master.settings.semester,
              id_siswa: this.selectedSiswaPrint
            });
            this.raporData = res.data;
          } catch (err) {
            this.notify(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        getKelasOnlyName(id) {
          const cleanId = String(id || '').trim();
          return this.master.kelas.find(x => String(x.id_kelas).trim() === cleanId)?.nama_kelas || id;
        },

        getKelasFase(id) {
          const cleanId = String(id || '').trim();
          return this.master.kelas.find(x => String(x.id_kelas).trim() === cleanId)?.fase || '-';
        },

        getWaliKelasName(idKelas) {
          const cleanId = String(idKelas || '').trim();
          const kls = this.master.kelas.find(k => String(k.id_kelas).trim() === cleanId);
          const wali = this.master.users.find(u => String(u.id_user).trim() === String(kls?.id_wali_kelas || '').trim());
          return wali ? wali.nama_lengkap : this.user.nama_lengkap;
        },

        getWaliKelasNip(idKelas) {
          const cleanId = String(idKelas || '').trim();
          const kls = this.master.kelas.find(k => String(k.id_kelas).trim() === cleanId);
          const wali = this.master.users.find(u => String(u.id_user).trim() === String(kls?.id_wali_kelas || '').trim());
          return wali?.nip_nik || this.user.nip_nik || '-';
        },

        getRaporMapelByGroup(groupName) {
          const fase = this.getKelasFase(this.raporData?.siswa?.id_kelas);
          return this.master.mapel
            .filter(m => {
              const berlaku = String(m.fase_berlaku || 'A,B,C').split(',').map(x => x.trim());
              return String(m.kelompok).trim() === groupName && berlaku.includes(fase);
            })
            .sort((a, b) => Number(a.urutan_cetak) - Number(b.urutan_cetak));
        },

        getNilaiSiswaMapel(idMapel) {
          const cleanMpl = String(idMapel || '').trim();
          return this.raporData?.nilaiIntra.find(n => String(n.id_mapel).trim() === cleanMpl);
        },

        getRaporTotalNilai() {
          if (!this.raporData) return '-';
          const mapelTampil = [
            ...this.getRaporMapelByGroup('Intrakurikuler'),
            ...this.getRaporMapelByGroup('Mulok')
          ];
          let total = 0;
          let adaNilai = false;
          mapelTampil.forEach(m => {
            const raw = this.getNilaiSiswaMapel(m.id_mapel)?.nilai_akhir;
            const num = Number(raw);
            if (raw !== undefined && raw !== '' && !isNaN(num)) {
              total += num;
              adaNilai = true;
            }
          });
          return adaNilai ? total : '-';
        },

        getRaporPrestasiEkskulList() {
          const wali = this.raporData?.dataWali;
          const list = [];
          if (wali?.ekskul_pilihan_json) {
            try {
              const arr = JSON.parse(wali.ekskul_pilihan_json);
              arr.forEach(item => {
                if (item.nama && item.prestasi && String(item.prestasi).trim() !== '') {
                  list.push({
                    nama: item.nama,
                    prestasi: String(item.prestasi).trim()
                  });
                }
              });
            } catch (e) {}
          }
          return list;
        },

        getRaporFooterLeft() {
          const rawSmt = String(this.master.settings.semester || 'Ganjil');
          let smtLabel = rawSmt;
          if (rawSmt.toLowerCase().includes('ganjil') || rawSmt.startsWith('1')) {
            smtLabel = 'Ganjil';
          } else if (rawSmt.toLowerCase().includes('genap') || rawSmt.startsWith('2')) {
            smtLabel = 'Genap';
          }
          const ta = this.master.settings.tahun_ajaran || '2026/2027';
          return `Rapor Semester ${smtLabel} TA. ${ta}`;
        },

        getRaporEkskulList() {
          const wali = this.raporData?.dataWali;
          const list = [
            {
              nama: 'Pramuka (Ekstrakurikuler Wajib)',
              predikat: wali?.ekskul_wajib || 'Baik',
              keterangan: 'Aktif mengikuti kegiatan kepramukaan dan menunjukkan sikap disiplin serta gotong royong.'
            }
          ];
          if (wali?.ekskul_pilihan_json) {
            try {
              const arr = JSON.parse(wali.ekskul_pilihan_json);
              arr.forEach(item => {
                if (item.nama && !item.is_wajib_pramuka) {
                  list.push({
                    nama: item.nama,
                    predikat: item.predikat || 'Baik',
                    keterangan: `Menunjukkan partisipasi dan perkembangan keterampilan yang ${String(item.predikat || 'baik').toLowerCase()} dalam kegiatan ${item.nama}.`
                  });
                }
              });
            } catch (e) {}
          }
          return list;
        }
      };
    }
  </script>
</body>
</html>
